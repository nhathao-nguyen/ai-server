[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-server"
version = "0.1.0"
description = "LAN AI inference gateway for Ollama and local TTS providers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "pytest-httpx>=0.30",
]
model-gpu = [
  "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git",
  "torch==2.6.0; python_version < '3.14'",
  "torchaudio==2.6.0; python_version < '3.14'",
  "torch>=2.9.0; python_version >= '3.14'",
  "torchaudio>=2.9.0; python_version >= '3.14'",
]
model-vieneu = [
  "onnxruntime>=1.17",
  "vieneu",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'win32' and python_full_version < '3.14'" },
]
torchaudio = [
  { index = "pytorch-cu124", marker = "sys_platform == 'win32' and python_full_version < '3.14'" },
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
